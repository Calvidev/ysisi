<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calvi.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:  #1C3A2A;
      --cream:  #F2EDE4;
      --muted:  rgba(28,58,42,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--green);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2rem;
      letter-spacing: 0.06em;
    }
    p {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    a {
      color: var(--green);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>calvi.dev</h1>
  <p>Ver <a href="/mexico">México · Mundial 2026</a></p>
</body>
</html>
